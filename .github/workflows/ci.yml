name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run when new commits are pushed to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # One failure should not hide the others.
      fail-fast: false
      matrix:
        # Windows is included on purpose: this project is developed on Windows,
        # and it is where path handling and npm scripts break first.
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` installs exactly what package-lock.json specifies.
      - name: Install
        run: npm ci

      # Build first. The examples import the package by name rather than by a
      # relative path, so they cannot typecheck until dist exists.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # No secrets are needed anywhere in this workflow. The tests run against
      # recorded fixtures through a mocked fetch and never reach the network, so
      # CI cannot spend SerpApi credits and no API key has to be stored here.
      - name: Test
        run: npm test

      - name: Check the published file list
        working-directory: packages/serpapi-ai-sdk-tools
        run: npm pack --dry-run
